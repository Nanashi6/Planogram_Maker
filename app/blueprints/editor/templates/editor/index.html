{% extends "base.html" %}

{% block styles %}
<style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    .container { margin: 0; overflow: hidden; font-family: sans-serif; display: flex; height: 100vh; }
    #c {
        width: 80vw;
        height: 100vh;
        display: block;
        outline: none;
        cursor: default;
    }

    #sidebar-container {
        width: 20vw;
        height: 100vh;
        display: flex;
        flex-direction: row;
        border-left: 1px solid #ccc;
        box-sizing: border-box;
        background-color: #f0f0f0;
    }

    /* Tab Navigation Styles (Vertical on the left) */
    .tab-navigation {
        display: flex;
        flex-direction: column;
        border-right: 1px solid #ccc;
        width: 55px; /* Ширина вертикальной панели вкладок - немного увеличена для повернутого текста */
        flex-shrink: 0;
        background-color: #e0e0e0;
    }

    .tab-button {
        /* width: 100%; /* Кнопка занимает всю ширину tab-navigation */
        /* height: 150px; /* Высота кнопки определяет "длину" вкладки для текста */
        /* Убираем старый padding, т.к. центрирование текста будет через flex */
        padding: 0;
        cursor: pointer;
        background-color: #e0e0e0;
        border: none;
        border-bottom: 1px solid #ccc;
        outline: none;
        font-family: sans-serif;
        font-size: 14px;
        box-sizing: border-box;
        transition: background-color 0.2s ease;

        /* Flex для центрирования повернутого текста внутри кнопки */
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden; /* Чтобы повернутый текст не вылезал за пределы кнопки */
        position: relative; /* Для псевдо-элемента active */

        /* Определяем размеры для кнопки. Ширина панели навигации (55px) станет "высотой" для текста.
           Высота кнопки (например, 120px) станет "шириной" для текста. */
        width: 100%; /* Занимает всю ширину родителя (.tab-navigation) */
        min-height: 100px; /* Минимальная "длина" вкладки, для коротких слов */
        flex-grow: 1; /* Позволяет кнопкам равномерно занять доступное пространство, если их много */
    }
    .tab-button:last-child {
        border-bottom: none;
    }
    .tab-button:hover {
        background-color: #d0d0d0;
    }

    .tab-button-text {
        display: block;
        white-space: nowrap; /* Важно, чтобы текст не переносился при повороте */
        transform: rotate(-90deg);
        transform-origin: center center;
        /* Опционально: если текст слишком длинный, можно добавить ... */
        /*
        max-width: 100px;  Пример - если кнопка .tab-button имеет height: 120px,
                           то max-width для текста должен быть чуть меньше
        overflow: hidden;
        text-overflow: ellipsis;
        */
    }

    .tab-button.active {
        background-color: #f0f0f0; /* Фон как у области контента */
        font-weight: bold;
        /* z-index: 1; /* Чтобы быть над неактивными вкладками, если есть пересечения */
    }

    /* Визуальное соединение активной вкладки с контентом */
    .tab-button.active::after {
        content: "";
        position: absolute;
        top: 0;
        right: -1px; /* Перекрывает правую границу .tab-navigation */
        width: 1px;
        height: 100%;
        background-color: #f0f0f0; /* Тот же цвет, что и фон контента */
    }


    /* Tab Content Styles */
    .tab-content {
        display: none;
        padding: 15px;
        overflow-y: auto;
        flex-grow: 1;
        box-sizing: border-box;
        height: 100%;
    }
    .tab-content.active {
        display: block;
    }

    #sidebar-container h3 {
        margin-top: 0;
        margin-bottom: 10px;
        font-size: 16px;
        color: #333;
    }

    .product-item {
        border: 1px solid #ddd;
        padding: 8px;
        margin-bottom: 5px;
        background-color: #fff;
        cursor: grab;
        user-select: none;
        border-radius: 3px;
    }
    .product-item:active {
        cursor: grabbing;
        background-color: #f9f9f9;
    }

    .shelfUnit-item {
        border: 1px solid #ddd;
        padding: 8px;
        margin-bottom: 5px;
        background-color: #fff;
        cursor: pointer;
        user-select: none;
        border-radius: 3px;
    }
    .shelfUnit-item:hover {
        background-color: #e9e9e9;
    }

    #tooltip {
        position: absolute;
        display: none;
        padding: 5px 10px;
        background-color: rgba(0, 0, 0, 0.75);
        color: white;
        border-radius: 3px;
        font-size: 12px;
        pointer-events: none;
        z-index: 1001;
        white-space: nowrap;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div> <canvas id="c"></canvas> </div>

    <div id="sidebar-container">
        <div class="tab-navigation">
            <button class="tab-button active" data-tab="products">

            <button class="tab-button" data-tab="shelfUnits">

        <div id="tab-content-shelfUnits" class="tab-content">

            <div id="shelfUnit-list">
            </div>
        </div>

        <div id="tab-content-planograms" class="tab-content">

</div>
{% endblock %}

{% block scripts %}
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.162.0/build/three.module.js",

<script>
    /**
    * Функция для настройки вкладок (табов)
    */
    function setupTabs() {
        const tabButtons = document.querySelectorAll('.tab-button');
        const tabContents = document.querySelectorAll('.tab-content');

        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                // Убрать 'active' класс со всех кнопок и контентов
                tabButtons.forEach(btn => btn.classList.remove('active'));
                tabContents.forEach(content => content.classList.remove('active'));

                // Добавить 'active' класс к нажатой кнопке и соответствующему контенту
                button.classList.add('active');
                const tabId = button.dataset.tab; // e.g., "products" or "shelfUnits"
                const activeContent = document.getElementById(`tab-content-${tabId}`);
                if (activeContent) {
                    activeContent.classList.add('active');
                } else {
                    console.warn(`Tab content with ID 'tab-content-${tabId}' not found.`);
                }
            });
        });
    }
    setupTabs()
</script>

<script type="module">
    import * as THREE from 'three';

    /** 
    *   Функция для изменения размера рендерера в соответствии с размером холста
    */
    function resizeRendererToDisplaySize(renderer) {
        const canvas = renderer.domElement;
        const pixelRatio = window.devicePixelRatio;
        const width = Math.floor(canvas.clientWidth * pixelRatio);
        const height = Math.floor(canvas.clientHeight * pixelRatio);
        const needResize = canvas.width !== width || canvas.height !== height;
        if (needResize) {
            renderer.setSize(width, height, false);
        }
        return needResize;
    }

    const SHELF_THICKNESS = 5; // Толщина доски полки

    /** 
    * Функция для создания 3D-модели стеллажа 
    */
    function createcurrentDisplayedShelfUnit(shelfUnitData, shelfGap = 2) {
        const shelfUnitGroup = new THREE.Group();
        shelfUnitGroup.name = `shelfUnit_${shelfUnitData.shelf_unit_number}`;
        shelfUnitGroup.userData.isShelfUnit = true;
        let currentY = 0;
        const sortedShelves = [...shelfUnitData.shelves].sort((a, b) => a.shelf_number - b.shelf_number);
        const baseColor = 0xaaaaaa;

        sortedShelves.forEach((shelfData, index) => {
            if (shelfData.length <= 0 || shelfData.depth <= 0) {
                console.warn(`Полка ${shelfData.shelf_number} имеет неверные размеры (длина/глубина), пропускается.`);
                return;
            }
            if (shelfData.height <= 0) {
                console.warn(`Полка ${shelfData.shelf_number} имеет неверную полезную высоту, используется значение по умолчанию 50.`);
                shelfData.height = 50;
            }

            const shelfBoardGeometry = new THREE.BoxGeometry(shelfData.length, SHELF_THICKNESS, shelfData.depth);
            const material = new THREE.MeshBasicMaterial({
                color: new THREE.Color(baseColor).offsetHSL(0, 0, index * 0.05),
                opacity: 0.95, transparent: true,
            });
            const shelfMesh = new THREE.Mesh(shelfBoardGeometry, material);
            shelfMesh.name = `shelf_${shelfData.shelf_number}`;
            shelfMesh.userData = {
                isShelf: true, shelfNumber: shelfData.shelf_number,
                shelfUnitNumber: shelfUnitData.shelf_unit_number,
                originalColor: material.color.clone(), placedProductUUIDs: [],
                usableHeight: shelfData.height, shelfThickness: SHELF_THICKNESS
            };
            shelfMesh.position.set(0, currentY + SHELF_THICKNESS / 2, 0);
            shelfUnitGroup.add(shelfMesh);
            currentY += SHELF_THICKNESS + shelfData.height + shelfGap;
        });

        const maxWidth = Math.max(0, ...sortedShelves.map(s => s.length));
        const maxDepth = Math.max(0, ...sortedShelves.map(s => s.depth));
        const legHeight = 10;
        if (sortedShelves.length > 0) {
            const baseGeometry = new THREE.BoxGeometry(maxWidth, legHeight, maxDepth);
            const baseMaterial = new THREE.MeshBasicMaterial({ color: 0x555555 });
            const baseMesh = new THREE.Mesh(baseGeometry, baseMaterial);
            baseMesh.position.set(0, -legHeight / 2, 0);
            shelfUnitGroup.add(baseMesh);
            shelfUnitGroup.position.y = legHeight;
        }
        return shelfUnitGroup;
    }

    //#region API
    async function get_shelfUnits() {
        const apiUrl = `/editor/get_shelfUnits`;
        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const data = await response.json();
            return data;
        } catch (error) {
            console.error("Error loading shelfUnits list:", error);
        } finally {
            console.log('Стеллажи удачно загружены')
        }
    }

    async function get_products() {
        const apiUrl = `/editor/get_products`;
        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const data = await response.json();
            return data;
        } catch (error) {
            console.error("Error loading products list:", error);
        } finally {
            console.log('Товары удачно загружены')
        }
    }
    //#endregion

    /**
     * Функция для генерации числового хеша из строки.
     * @param {string} str - Входная строка (например, имя бренда).
     * @returns {number} Числовой хеш.
     */
     function simpleStringHash(str) {
        let hash = 0;
        if (!str || str.length === 0) {
            return hash;
        }
        for (let i = 0; i < str.length; i++) {
            const char = str.charCodeAt(i);
            hash = (hash << 5) - hash + char;
            hash |= 0;
        }
        return Math.abs(hash);
    }

    /**
     * Генерирует цвет на основе числового хеша.
     * @param {number} hash - Числовой хеш.
     * @returns {THREE.Color} Сгенерированный цвет.
     */
    function colorFromHash(hash) {
        const r = (hash & 0xFF0000) >> 16;
        const g = (hash & 0x00FF00) >> 8;
        const b = hash & 0x0000FF;

        const minComponent = 50;
        const range = 255 - minComponent;

        const finalR = minComponent + (r % range);
        const finalG = minComponent + (g % range);
        const finalB = minComponent + (b % range);

        return new THREE.Color(`rgb(${finalR}, ${finalG}, ${finalB})`);
    }

    /**
    * Функция для создания 3D-модели товара (куба)
    */
    function createProductMesh(productData, isGhost = false) {
        const geometry = new THREE.BoxGeometry(productData.length, productData.height, productData.depth);
        if (!geometry.boundingBox) {
            geometry.computeBoundingBox();
        }

        let productColor;
        if (isGhost) {
            productColor = new THREE.Color(0x00ff00); // Зеленый для "призрака"
        } else {
            const brandIdentifier = productData.brand.name + " " + productData.category.name || productData.name || "default_brand";
            const brandHash = simpleStringHash(brandIdentifier);
            productColor = colorFromHash(brandHash);
        }

        const material = new THREE.MeshBasicMaterial({
            color: productColor,
            transparent: true,
            opacity: isGhost ? 0.6 : 1.0
        });
        const productMesh = new THREE.Mesh(geometry, material);
        productMesh.name = `product_${productData.id || Math.random().toString(16).slice(2)}`;
        productMesh.userData = {
            isProduct: true, isGhost: isGhost, productId: productData.id,
            productData: { ...productData }, placedOnShelfUUID: null,
            boundingBox: new THREE.Box3()
        };
        if (isGhost) productMesh.renderOrder = 1; // Призрак рендерится поверх
        productMesh.userData.boundingBox.copy(geometry.boundingBox).applyMatrix4(productMesh.matrixWorld);
        return productMesh;
    }

    /**
    * Функция для проверки столкновения (пересечения) двух мешей по их bounding box
    */
    function checkCollision(mesh1, mesh2) {
        return mesh1.userData.boundingBox.intersectsBox(mesh2.userData.boundingBox);
    }

    /**
    * Функция для обновления bounding box меша в мировых координатах
    */
    function updateMeshBoundingBox(mesh) {
        if (!mesh.geometry.boundingBox) {
            mesh.geometry.computeBoundingBox();
        }
        mesh.userData.boundingBox.copy(mesh.geometry.boundingBox);
        mesh.userData.boundingBox.applyMatrix4(mesh.matrixWorld);
    }

    /**
    * Функция для создания каркасной обводки объекта
    */
    function createWireframeOutline(object, color = 0xff0000, scaleFactor = 1.02) {
        const outlineGeometry = object.geometry;
        const outlineMaterial = new THREE.MeshBasicMaterial({
            color: color,
            wireframe: true,
            depthTest: false,
            opacity: 0.8,
            transparent: true
        });
        const outlineMesh = new THREE.Mesh(outlineGeometry, outlineMaterial);

        outlineMesh.position.copy(object.position);
        outlineMesh.rotation.copy(object.rotation);
        outlineMesh.scale.copy(object.scale).multiplyScalar(scaleFactor);
        outlineMesh.matrixAutoUpdate = true;
        outlineMesh.renderOrder = (object.renderOrder || 0) + 1;
        return outlineMesh;
    }

    /**
    * Основная функция приложения
    */
    function main() {
        const canvas = document.querySelector('#c');
        const productListDiv = document.querySelector('#product-list');
        const shelfUnitListDiv = document.querySelector('#shelfUnit-list');
        const tooltipElement = document.getElementById('tooltip');
        if (!productListDiv || !tooltipElement || !shelfUnitListDiv) { console.error("КРИТИЧЕСКАЯ ОШИБКА: UI элемент не найден!"); return; }

        let currentDisplayedShelfUnit = NaN

        const renderer = new THREE.WebGLRenderer({ antialias: true, canvas });
        renderer.setClearColor(0xDDDDDD);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.sortObjects = true; // Важно для renderOrder

        // Настройка ортографической камеры
        const frustumSize = 700;
        let aspect = canvas.clientWidth / canvas.clientHeight;
        const camera = new THREE.OrthographicCamera(
            frustumSize * aspect / -2, frustumSize * aspect / 2,
            frustumSize / 2, frustumSize / -2, 0.1, 5000
        );

        // Переменные для управления камерой (орбита, панорамирование, зум)
        const cameraTarget = new THREE.Vector3(0, 100, 0); // Точка, вокруг которой вращается камера
        let cameraRadius = 800; // Расстояние от цели до камеры
        let cameraPhi = Math.PI / 2.8; // Полярный угол
        let cameraTheta = Math.PI / 4;  // Азимутальный угол
        const minPhi = 0.1, maxPhi = Math.PI - 0.1; // Ограничения для полярного угла
        const minRadius = 100, maxRadius = 2000; // Ограничения для радиуса (зума орбиты)
        let cameraZoom = 1.0; // Зум для ортографической проекции
        const minOrthoZoom = 0.2, maxOrthoZoom = 5.0; // Ограничения для ортографического зума

        /**
        * Функция для обновления проекции камеры (при зуме или изменении размера окна)
        */
        function updateCameraProjection() {
            const DYNAMIC_FRUSTUM_SIZE = frustumSize / cameraZoom;
            camera.left = -DYNAMIC_FRUSTUM_SIZE * aspect / 2;
            camera.right = DYNAMIC_FRUSTUM_SIZE * aspect / 2;
            camera.top = DYNAMIC_FRUSTUM_SIZE / 2;
            camera.bottom = -DYNAMIC_FRUSTUM_SIZE / 2;
            camera.updateProjectionMatrix();
        }

        // Функция для обновления позиции и ориентации камеры
        function updateCameraPosition() {
            camera.position.x = cameraTarget.x - cameraRadius * Math.sin(cameraPhi) * Math.sin(cameraTheta); // Изменен знак для начального вида
            camera.position.y = cameraTarget.y + cameraRadius * Math.cos(cameraPhi);
            camera.position.z = cameraTarget.z - cameraRadius * Math.sin(cameraPhi) * Math.cos(cameraTheta); // Изменен знак
            camera.lookAt(cameraTarget);
            updateCameraProjection();
        }
        updateCameraPosition(); // Начальная установка камеры

        const raycaster = new THREE.Raycaster(); // Для определения пересечений луча с объектами
        const mouse = new THREE.Vector2();     // Для хранения координат мыши в NDC
        const scene = new THREE.Scene();       // Основная 3D сцена

        // Переменные состояния для Drag & Drop и выбора объектов
        let draggedProductData = null;      // Данные товара, перетаскиваемого из HTML списка
        let productGhostMesh = null;        // "Призрак" (полупрозрачный куб) перетаскиваемого товара
        let currentlyDraggedObject = null;  // 3D объект товара, который сейчас активно перетаскивается по сцене
        let isDraggingExistingProduct = false; // Флаг, что перетаскивается уже размещенный товар
        let selectedForOperation = null;    // Товар, выбранный для операции (удаления, обводки)
        let currentOutlineMesh = null;      // Текущий меш обводки выбранного товара

        // Функция для получения всех размещенных товаров на сцене (кроме исключенного)
        function getAllPlacedProducts(excludeMesh = null) {
            const products = [];
            scene.traverse((object) => {
                if (object.userData.isProduct && !object.userData.isGhost) {
                    if (excludeMesh && object.uuid === excludeMesh.uuid) return;
                    products.push(object);
                }
            });
            return products;
        }

        let hoveredShelf = null; // Полка, над которой находится курсор
        const placementPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0); // Плоскость для определения точки пересечения

        // Функция для получения мировых координат точки пересечения луча мыши с заданной плоскостью
        function getMouseWorldPosition(event, targetPlane) {
            const rect = canvas.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / canvas.clientWidth) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / canvas.clientHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersectPoint = new THREE.Vector3();
            if (raycaster.ray.intersectPlane(targetPlane, intersectPoint)) {
                return intersectPoint;
            }
            return null;
        }

        // Общая функция для позиционирования "призрака" товара и проверки возможности его размещения
        function positionAndValidateGhost(event, currentProductDataRef) {
            if (!productGhostMesh || !currentProductDataRef) {
                if(productGhostMesh) productGhostMesh.visible = false;
                return false;
            }
            const currentProductData = currentProductDataRef;
            const rect = canvas.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / canvas.clientWidth) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / canvas.clientHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const shelfIntersects = raycaster.intersectObjects(currentDisplayedShelfUnit.children.filter(c => c.userData.isShelf), false);
            let canPlace = false;

            if (hoveredShelf) { // Сброс подсветки предыдущей полки
                hoveredShelf.material.color.copy(hoveredShelf.userData.originalColor);
                hoveredShelf = null;
            }

            if (shelfIntersects.length > 0) { // Если курсор над какой-либо полкой
                const targetShelf = shelfIntersects[0].object;
                hoveredShelf = targetShelf;
                hoveredShelf.material.color.setHex(0xffff00); // Подсветка текущей полки

                const shelfWorldPosition = new THREE.Vector3();
                targetShelf.getWorldPosition(shelfWorldPosition); // Мировые координаты центра полки
                const shelfTopSurfaceY = shelfWorldPosition.y + targetShelf.userData.shelfThickness / 2; // Y-координата верха полки
                placementPlane.setComponents(0, 1, 0, -shelfTopSurfaceY); // Обновление плоскости для пересечения
                const intersectionPointOnShelfPlane = getMouseWorldPosition(event, placementPlane); // Точка клика на плоскости полки

                if (intersectionPointOnShelfPlane) {
                    // Позиционирование призрака: по X - центр полки (глубина), по Z - где кликнули (длина)
                    productGhostMesh.position.x = shelfWorldPosition.x;
                    productGhostMesh.position.z = intersectionPointOnShelfPlane.z;
                    productGhostMesh.position.y = shelfTopSurfaceY + currentProductData.height / 2; // Низ товара на верху полки
                    productGhostMesh.visible = true;
                    updateMeshBoundingBox(productGhostMesh); // Обновление bounding box призрака

                    // Валидация размещения
                    let isValidPlacement = true;
                    const shelfDim = targetShelf.geometry.parameters; // Размеры полки (width - это ее "длина", depth - ее "глубина")
                    const shelfUsableH = targetShelf.userData.usableHeight; // Полезная высота НАД полкой

                    // 1. Проверка по высоте
                    if (currentProductData.height > shelfUsableH) isValidPlacement = false;
                    // 2. Проверка выхода за пределы полки (с учетом поворота стеллажа)
                    // Глубина товара (productData.depth) идет вдоль глубины полки (shelfDim.depth, мировая X)
                    // Длина товара (productData.length) идет вдоль длины полки (shelfDim.width, мировая Z)
                    if (Math.abs(productGhostMesh.position.x - shelfWorldPosition.x) + currentProductData.depth / 2 > shelfDim.depth / 2) isValidPlacement = false;
                    if (Math.abs(productGhostMesh.position.z - shelfWorldPosition.z) + currentProductData.length / 2 > shelfDim.width / 2) isValidPlacement = false;

                    // 3. Проверка столкновений с другими товарами
                    if (isValidPlacement) {
                        const productsToCollideWith = getAllPlacedProducts(isDraggingExistingProduct ? currentlyDraggedObject : null);
                        for (const otherProduct of productsToCollideWith) {
                            updateMeshBoundingBox(otherProduct);
                            if (checkCollision(productGhostMesh, otherProduct)) {
                                isValidPlacement = false; break;
                            }
                        }
                    }
                    canPlace = isValidPlacement;
                    productGhostMesh.material.color.set(canPlace ? 0x00ff00 : 0xff0000); // Зеленый или красный цвет призрака
                } else { productGhostMesh.visible = false; } // Если нет пересечения с плоскостью полки
            } else { if (productGhostMesh) productGhostMesh.visible = false; } // Если не над полкой

            if (productGhostMesh) productGhostMesh.userData.canPlace = canPlace; // Сохранить результат валидации
            return canPlace;
        }

        // Обработчик события 'dragover' на холсте (когда товар из HTML списка тащится НАД холстом)
        canvas.addEventListener('dragover', (event) => {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'copy';
            if (isDraggingExistingProduct) return; // Если тащим существующий, эта логика не нужна
            positionAndValidateGhost(event, draggedProductData);
        });

        // Обработчик события 'dragleave' на холсте (когда курсор с перетаскиваемым товаром покидает холст)
        canvas.addEventListener('dragleave', () => {
            if (hoveredShelf) {
                hoveredShelf.material.color.copy(hoveredShelf.userData.originalColor);
                hoveredShelf = null;
            }
        });

        // Обработчик события 'drop' на холсте (когда товар из HTML списка "брошен" на холст)
        canvas.addEventListener('drop', (event) => {
            event.preventDefault();
            if (isDraggingExistingProduct) return; // Если тащим существующий, эта логика не нужна

            if (hoveredShelf) {
                hoveredShelf.material.color.copy(hoveredShelf.userData.originalColor);
            }
            const canPlace = productGhostMesh && productGhostMesh.visible && productGhostMesh.userData.canPlace;

            if (canPlace && draggedProductData) { // Если размещение возможно
                const finalProductData = JSON.parse(event.dataTransfer.getData('application/json'));
                const productMesh = createProductMesh(finalProductData); // Создаем финальный товар
                productMesh.position.copy(productGhostMesh.position);    // Копируем позицию с призрака
                updateMeshBoundingBox(productMesh);
                scene.add(productMesh); // Добавляем в сцену

                if (hoveredShelf) { // Связываем товар с полкой
                    productMesh.userData.placedOnShelfUUID = hoveredShelf.uuid;
                    hoveredShelf.userData.placedProductUUIDs.push(productMesh.uuid);
                }
            } else {
                console.log("Размещение отменено или неверная позиция.");
            }
            // Очистка после drop
            if (productGhostMesh) {
                scene.remove(productGhostMesh); productGhostMesh.geometry.dispose(); productGhostMesh.material.dispose(); productGhostMesh = null;
            }
            draggedProductData = null;
            hoveredShelf = null;
        });

        // Переменные для управления состоянием мыши (орбита, панорамирование)
        let isOrbiting = false;
        let isCtrlPanning = false;
        let lastMouseX = 0, lastMouseY = 0;

        // Вспомогательная функция для удаления текущей обводки
        function removeCurrentOutline() {
            if (currentOutlineMesh) {
                scene.remove(currentOutlineMesh);
                if (currentOutlineMesh.material) currentOutlineMesh.material.dispose();
                currentOutlineMesh = null;
            }
        }

        /**
        * Обработчик нажатия кнопки мыши на холсте
        */
        canvas.addEventListener('mousedown', (event) => {
            // Средняя кнопка мыши: орбита или Ctrl+панорамирование
            if (event.button === 1) {
                if (event.ctrlKey) { isCtrlPanning = true; } // Ctrl + Средняя кнопка
                else { isOrbiting = true; }                  // Просто средняя кнопка
                lastMouseX = event.clientX;
                lastMouseY = event.clientY;
                canvas.style.cursor = 'move';
                event.preventDefault();
                return;
            }
            // Только левая кнопка мыши для выбора/перетаскивания товаров
            if (event.button !== 0) return;

            const rect = canvas.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / canvas.clientWidth) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / canvas.clientHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const productMeshes = getAllPlacedProducts();
            const intersects = raycaster.intersectObjects(productMeshes, false);
            removeCurrentOutline(); // Убрать предыдущую обводку при любом клике левой кнопкой

            if (intersects.length > 0) { // Если кликнули по товару
                const clickedObject = intersects[0].object;
                // Если уже тащим другой товар, не позволяем выбрать новый для перетаскивания
                if (isDraggingExistingProduct && currentlyDraggedObject !== clickedObject) return;

                selectedForOperation = clickedObject; // Выбираем объект для операций (удаление, обводка)
                currentOutlineMesh = createWireframeOutline(selectedForOperation); // Создаем обводку
                scene.add(currentOutlineMesh); // Добавляем обводку в сцену

                // Начинаем перетаскивание этого объекта
                currentlyDraggedObject = clickedObject;
                isDraggingExistingProduct = true;

                if (productGhostMesh) scene.remove(productGhostMesh); // Удаляем старый призрак
                productGhostMesh = createProductMesh(currentlyDraggedObject.userData.productData, true); // Создаем призрак для таскаемого объекта
                productGhostMesh.position.copy(currentlyDraggedObject.position); // Призрак на месте оригинала
                updateMeshBoundingBox(productGhostMesh);
                scene.add(productGhostMesh);
                currentlyDraggedObject.visible = false; // Скрываем оригинал
                canvas.style.cursor = 'grabbing';   // Меняем курсор
            } else { // Клик по пустому месту
                selectedForOperation = null; // Сбрасываем выбор
            }
        });

        // Обработчик движения мыши над холстом
        canvas.addEventListener('mousemove', (event) => {
            if (isOrbiting) { // Если режим орбиты
                const deltaX = event.clientX - lastMouseX;
                const deltaY = event.clientY - lastMouseY;
                lastMouseX = event.clientX;
                lastMouseY = event.clientY;
                cameraTheta -= deltaX * 0.005; // Вращение по горизонтали
                cameraPhi -= deltaY * 0.005;   // Вращение по вертикали
                cameraPhi = Math.max(minPhi, Math.min(maxPhi, cameraPhi)); // Ограничение вертикального вращения
                 updateCameraPosition();
            } else if (isCtrlPanning) { // Если режим Ctrl+панорамирования
                const deltaX = event.clientX - lastMouseX;
                lastMouseX = event.clientX;
                const panSpeed = 0.5; // Скорость панорамирования
                // Панорамирование вдоль стеллажа (по мировой оси Z после поворота стеллажа)
                cameraTarget.z -= Math.sign(deltaX) * Math.abs(deltaX) * panSpeed * 0.1;
                updateCameraPosition();
            } else if (isDraggingExistingProduct && productGhostMesh) { // Если тащим существующий товар
                positionAndValidateGhost(event, currentlyDraggedObject.userData.productData); // Обновляем позицию призрака
                if (currentOutlineMesh) { // Обновляем позицию обводки, чтобы она следовала за призраком
                    currentOutlineMesh.position.copy(productGhostMesh.position);
                    currentOutlineMesh.rotation.copy(productGhostMesh.rotation);
                    currentOutlineMesh.scale.copy(productGhostMesh.scale).multiplyScalar(1.02); // Масштаб с фактором
                }
            } else { // Если нет активных действий - логика для всплывающей подсказки
                const rect = canvas.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / canvas.clientWidth) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / canvas.clientHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const productMeshes = getAllPlacedProducts();
                const intersects = raycaster.intersectObjects(productMeshes, false);

                if (intersects.length > 0) { // Если курсор над товаром
                    const hoveredProduct = intersects[0].object;
                    tooltipElement.style.display = 'block';
                    tooltipElement.textContent = hoveredProduct.userData.productData.name;
                    tooltipElement.style.left = `${event.clientX + 15}px`;
                    tooltipElement.style.top = `${event.clientY - 25}px`;
                } else { // Если курсор не над товаром
                    tooltipElement.style.display = 'none';
                }
            }
        });

        // Обработчик отпускания кнопки мыши на холсте
        canvas.addEventListener('mouseup', (event) => {
            if (isOrbiting || isCtrlPanning) { // Завершение орбиты или Ctrl+панорамирования
                isOrbiting = false;
                isCtrlPanning = false;
                canvas.style.cursor = 'default';
                return;
            }
            if (event.button !== 0) return; // Только для левой кнопки

            // Завершение перетаскивания существующего товара
            if (isDraggingExistingProduct && currentlyDraggedObject && productGhostMesh) {
                const canPlace = productGhostMesh.userData.canPlace;
                if (canPlace) { // Если размещение возможно
                    // Удаляем товар со старой полки
                    if (currentlyDraggedObject.userData.placedOnShelfUUID) {
                        const oldShelf = scene.getObjectByProperty('uuid', currentlyDraggedObject.userData.placedOnShelfUUID);
                        if (oldShelf && oldShelf.userData.placedProductUUIDs) {
                            const index = oldShelf.userData.placedProductUUIDs.indexOf(currentlyDraggedObject.uuid);
                            if (index > -1) oldShelf.userData.placedProductUUIDs.splice(index, 1);
                        }
                    }
                    // Устанавливаем новую позицию и связываем с новой полкой
                    currentlyDraggedObject.position.copy(productGhostMesh.position);
                    updateMeshBoundingBox(currentlyDraggedObject);
                    if (hoveredShelf) {
                        currentlyDraggedObject.userData.placedOnShelfUUID = hoveredShelf.uuid;
                        hoveredShelf.userData.placedProductUUIDs.push(currentlyDraggedObject.uuid);
                    } else { // Если не над полкой (не должно случиться, если canPlace=true)
                        currentlyDraggedObject.userData.placedOnShelfUUID = null;
                    }
                    // Обновляем позицию обводки до финальной позиции объекта
                    if(currentOutlineMesh && selectedForOperation === currentlyDraggedObject){
                        currentOutlineMesh.position.copy(currentlyDraggedObject.position);
                        currentOutlineMesh.rotation.copy(currentlyDraggedObject.rotation);
                        currentOutlineMesh.scale.copy(currentlyDraggedObject.scale).multiplyScalar(1.02);
                    }
                } else { // Если размещение отменено
                    // Обводка должна остаться на старом месте объекта
                    if(currentOutlineMesh && selectedForOperation === currentlyDraggedObject){
                        currentOutlineMesh.position.copy(currentlyDraggedObject.position);
                        currentOutlineMesh.rotation.copy(currentlyDraggedObject.rotation);
                        currentOutlineMesh.scale.copy(currentlyDraggedObject.scale).multiplyScalar(1.02);
                    }
                }
                currentlyDraggedObject.visible = true; // Делаем оригинальный объект видимым
            }

            // Очистка после перетаскивания
            if (productGhostMesh) {
                scene.remove(productGhostMesh); productGhostMesh.geometry.dispose(); productGhostMesh.material.dispose(); productGhostMesh = null;
            }
            if(hoveredShelf){ // Сброс подсветки полки
                hoveredShelf.material.color.copy(hoveredShelf.userData.originalColor);
                hoveredShelf = null;
            }
            currentlyDraggedObject = null; // Сброс активно перетаскиваемого объекта
            isDraggingExistingProduct = false; // Сброс флага перетаскивания
            canvas.style.cursor = 'default'; // Возвращаем обычный курсор
            // selectedForOperation не сбрасываем, чтобы объект оставался "выбранным" для удаления
        });

        // Обработчик колесика мыши для зума
        canvas.addEventListener('wheel', (event) => {
            event.preventDefault();
            // Не зумировать, если активно орбитальное вращение или Ctrl+панорамирование
            if (isCtrlPanning || isOrbiting) return;

            if (event.ctrlKey) {
                // Можно добавить сюда другое действие на Ctrl+колесико, если нужно
            } else { // Обычный ортографический зум
                const zoomSpeed = 0.1;
                const zoomFactor = event.deltaY < 0 ? (1 + zoomSpeed) : (1 - zoomSpeed);
                cameraZoom *= zoomFactor;
                cameraZoom = Math.max(minOrthoZoom, Math.min(maxOrthoZoom, cameraZoom)); // Ограничение зума
                updateCameraProjection(); // Обновление проекции камеры
            }
        });

        // Обработчик нажатия клавиш (для удаления)
        window.addEventListener('keydown', (event) => {
            if (event.key === 'Delete' || event.key === 'Backspace') { // Если нажата Delete или Backspace
                if (selectedForOperation) { // И если есть выбранный для операции объект
                    removeCurrentOutline(); // Удаляем обводку
                    const productToDelete = selectedForOperation;

                    // Удаляем товар из списка на его полке
                    if (productToDelete.userData.placedOnShelfUUID) {
                        const shelf = scene.getObjectByProperty('uuid', productToDelete.userData.placedOnShelfUUID);
                        if (shelf && shelf.userData.placedProductUUIDs) {
                            const index = shelf.userData.placedProductUUIDs.indexOf(productToDelete.uuid);
                            if (index > -1) {
                                shelf.userData.placedProductUUIDs.splice(index, 1);
                            }
                        }
                    }
                    // Удаляем товар из сцены
                    scene.remove(productToDelete);
                    // Освобождаем ресурсы геометрии и материала
                    if (productToDelete.geometry) productToDelete.geometry.dispose();
                    if (productToDelete.material) {
                        if (Array.isArray(productToDelete.material)) {
                            productToDelete.material.forEach(m => m.dispose());
                        } else {
                            productToDelete.material.dispose();
                        }
                    }
                    selectedForOperation = null; // Сбрасываем выбор
                    tooltipElement.style.display = 'none'; // Скрываем подсказку, если она была для этого товара
                }
            }
        });

        /**
        * Функция для отображения выбранного стеллажа на сцене
        */
        function displayShelfUnit(shelfUnitData) {
            if (currentDisplayedShelfUnit) {
                scene.remove(currentDisplayedShelfUnit);
                console.log("Removed previous shelf unit:", currentDisplayedShelfUnit.name);
                currentDisplayedShelfUnit = null;
            }

            const productsToRemove = [];
            scene.traverse((object) => {
                if (object.userData.isProduct && !object.userData.isGhost) {
                    productsToRemove.push(object);
                }
            });

            productsToRemove.forEach(product => {
                scene.remove(product);
                console.log("Removed product:", product.name);
            });
            if(selectedForOperation && !scene.getObjectByProperty('uuid', selectedForOperation.uuid)){
                selectedForOperation = null;
                removeCurrentOutline();
            }

            const newShelfUnit = createcurrentDisplayedShelfUnit(shelfUnitData);
            newShelfUnit.rotation.y = Math.PI / 2;
            newShelfUnit.updateMatrixWorld();
            scene.add(newShelfUnit);
            currentDisplayedShelfUnit = newShelfUnit;

            console.log("Displayed new shelf unit:", currentDisplayedShelfUnit.name);
        }
            
        /**
        * Функция для заполнения HTML списка товаров
        */
        function populateProductList(products) {
            productListDiv.innerHTML = "";
            products.forEach(product => {
                const item = document.createElement('div');
                item.className = 'product-item';
                item.draggable = true;
                item.textContent = `${product.name} (${product.length}x${product.height}x${product.depth})`;
                item.dataset.productInfo = JSON.stringify(product);

                // Обработчик начала перетаскивания товара из HTML списка
                item.addEventListener('dragstart', (event) => {
                    removeCurrentOutline(); // Убрать обводку, если была
                    draggedProductData = JSON.parse(event.target.dataset.productInfo);
                    event.dataTransfer.setData('application/json', event.target.dataset.productInfo);
                    event.dataTransfer.effectAllowed = 'copy';
                    event.target.style.opacity = '0.9';
                    if (productGhostMesh) scene.remove(productGhostMesh); // Удалить предыдущий призрак
                    productGhostMesh = createProductMesh(draggedProductData, true);
                    productGhostMesh.visible = false; // Сначала невидим
                    scene.add(productGhostMesh);
                    isDraggingExistingProduct = false; // Это новый товар, а не существующий
                    selectedForOperation = null;    // Сбросить выбор
                });

                // Обработчик окончания перетаскивания товара из HTML списка
                item.addEventListener('dragend', (event) => {
                    event.target.style.opacity = '1';
                    draggedProductData = null;
                    if (productGhostMesh) { // Удалить призрак
                        scene.remove(productGhostMesh);
                        productGhostMesh.geometry.dispose();
                        productGhostMesh.material.dispose();
                        productGhostMesh = null;
                    }
                });
                   
                productListDiv.appendChild(item);
            });
        }
        get_products().then(d => {populateProductList(d);});

        function populateShelfUnitList(shelfUnits) {
            shelfUnitListDiv.innerHTML = "";
            shelfUnits.forEach(shelfUnitData => {
                const item = document.createElement('div');
                item.className = 'shelfUnit-item';
                item.textContent = `Стеллаж №: ${shelfUnitData.shelf_unit_number}`;
                item.dataset.shelfUnitInfo = JSON.stringify(shelfUnitData);
        
                item.addEventListener('click', function() {
                    const clickedShelfUnitData = JSON.parse(this.dataset.shelfUnitInfo);
                    displayShelfUnit(clickedShelfUnitData);
                });
        
                shelfUnitListDiv.appendChild(item);
            });
        }
        get_shelfUnits().then(d => {populateShelfUnitList(d);});

        // Цикл рендеринга
        function render(time) {
            time *= 0.001; // Конвертация времени в секунды
            if (resizeRendererToDisplaySize(renderer)) { // Если размер холста изменился
                aspect = canvas.clientWidth / canvas.clientHeight;
                updateCameraProjection(); // Обновляем проекцию камеры
            }
            renderer.render(scene, camera); // Рендерим сцену
            requestAnimationFrame(render);  // Запрашиваем следующий кадр анимации
        }
        requestAnimationFrame(render); // Запуск цикла рендеринга
    }
    document.addEventListener('DOMContentLoaded', main); // Вызов main после загрузки DOM
</script>
